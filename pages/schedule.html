<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.jolpi.ca https://api.open-meteo.com https://www.formula1.com https://www.motorsport.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>赛历 · F1 观赛助手</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages/schedule.css">
</head>
<body>
  <!-- 黑条一：站内导航 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="f1-logo" href="../index.html" aria-label="F1"><b>F1</b></a>
      <nav class="topnav" id="topnav"><!-- 由 navHtml('schedule', '../') 注入 --></nav>
      <div class="topbar-right">
        <span class="topbar-chip" id="data-source">数据加载中</span>
        <button type="button" class="topbar-btn" id="act-settings" aria-expanded="false" aria-controls="settings-pop">设置</button>
      </div>
    </div>
    <div class="topbar-cuts" aria-hidden="true"></div>
  </header>

  <!-- 黑条二：当前分站 + 双时钟 -->
  <div class="subbar">
    <div class="subbar-inner">
      <div class="subbar-race">
        <span class="sub-round" id="sub-round">R--</span>
        <span class="sub-date" id="sub-date">-- – -- ---</span>
        <span class="sub-name"><span class="flag-badge" id="sub-flag">--</span><span id="sub-name">载入中</span></span>
      </div>
      <div class="clocks">
        <div class="clock"><span class="clock-dot" aria-hidden="true"></span>
          <span class="clock-label">MY TIME</span><span class="clock-time" id="clock-local">--:--</span></div>
        <div class="clock"><span class="clock-label">TRACK TIME</span><span class="clock-time" id="clock-track">--:--</span></div>
      </div>
    </div>
  </div>

  <main class="page">
    <div class="page-head">
      <h1 class="display">2026 FIA 世界一级方程式锦标赛<sup>™</sup> 赛历</h1>
      <div class="page-head-actions">
        <!-- 本地筛选：只切分区可见性并重绘卡片区，与积分榜的 .seg 互不干扰 -->
        <div class="seg" id="schedule-filter" role="group" aria-label="赛历筛选">
          <button class="seg-btn is-active" type="button" data-tab="all">全部</button>
          <button class="seg-btn" type="button" data-tab="done">已完成</button>
          <button class="seg-btn" type="button" data-tab="upcoming">后续</button>
        </div>
        <button class="pill-btn pill-btn-red" type="button" id="act-refresh">刷新数据</button>
      </div>
    </div>

    <section class="band" id="band-next">
      <div class="band-head">
        <h2 class="band-title">下一站</h2>
        <span class="band-note" id="next-note"></span>
      </div>
      <!--
        两栏：左＝红色下一站卡（.cards.cards-featured 原样，只有这一张）+ 其下方的赛道信息卡；
        右＝周末时间表 / 正赛日天气（由 renderNextSide() 注入，窄屏自动堆叠）。
        赛道信息从右栏移到左列，是为了让两列高度对齐（原先左列只有一张红卡，下方留大片空白）。
      -->
      <div class="next-split">
        <div class="cards cards-featured" id="cards-next"></div>
        <!-- 赛道信息卡挂载点：宽屏时在左列红卡正下方，≤1240px 时顺序堆叠在红卡之后 -->
        <div class="next-circuit-host" id="next-circuit-host"></div>
        <div class="next-side" id="next-side"><!-- 下一站周末时间表 / 正赛日天气 --></div>
      </div>
    </section>

    <section class="band" id="band-done">
      <div class="band-head">
        <h2 class="band-title">本赛季已完成</h2>
        <span class="band-note" id="done-note"></span>
      </div>
      <div class="cards" id="cards-done"></div>
    </section>

    <section class="band" id="band-upcoming">
      <div class="band-head">
        <h2 class="band-title">后续分站</h2>
        <span class="band-note" id="upcoming-note"></span>
      </div>
      <div class="cards" id="cards-upcoming"></div>
    </section>
  </main>

  <footer class="app-footer"><div class="status-bar" id="status-bar"></div></footer>

  <noscript>
    <p class="state state-error">本应用需要启用 JavaScript。</p>
  </noscript>

  <script type="module" src="../assets/js/pages/schedule.js"></script>
  <div class="settings-pop" id="settings-pop" hidden></div>
</body>
</html>

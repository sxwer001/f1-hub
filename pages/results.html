<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.jolpi.ca https://api.open-meteo.com https://www.formula1.com https://www.motorsport.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>成绩 · F1 观赛助手</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages/results.css">
</head>
<body>
  <!-- 黑条一：站内导航 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="f1-logo" href="../index.html" aria-label="F1"><b>F1</b></a>
      <nav class="topnav" id="topnav"><!-- 由 navHtml(active, base) 注入 --></nav>
      <div class="topbar-right">
        <span class="topbar-chip" id="data-source">数据加载中</span>
        <button type="button" class="topbar-btn" id="act-settings" aria-expanded="false" aria-controls="settings-pop">设置</button>
      </div>
    </div>
    <div class="topbar-cuts" aria-hidden="true"></div>
  </header>

  <!-- 黑条二：当前分站 + 双时钟 -->
  <div class="subbar">
    <div class="subbar-inner">
      <div class="subbar-race">
        <span class="sub-round" id="sub-round">R--</span>
        <span class="sub-date" id="sub-date">-- – -- ---</span>
        <span class="sub-name"><span class="flag-badge" id="sub-flag">--</span><span id="sub-name">载入中</span></span>
      </div>
      <div class="clocks">
        <div class="clock">
          <span class="clock-dot" aria-hidden="true"></span>
          <span class="clock-label">MY TIME</span>
          <span class="clock-time" id="clock-local">--:--</span>
        </div>
        <div class="clock">
          <span class="clock-label">TRACK TIME</span>
          <span class="clock-time" id="clock-track">--:--</span>
        </div>
      </div>
    </div>
  </div>

  <main class="page">
    <div class="page-head">
      <h1 class="display">2026 赛季分站成绩</h1>
      <div class="page-head-actions">
        <label class="round-picker" for="round-select">
          <span class="round-picker-label">分站</span>
          <select id="round-select" aria-label="选择已完赛分站">
            <option value="">加载中…</option>
          </select>
        </label>
      </div>
    </div>

    <!-- 本站概要（真实统计，由 statRow 渲染） -->
    <section class="band" aria-label="本站概要">
      <div class="band-head">
        <h2 class="band-title" id="band-title">载入中…</h2>
        <span class="band-note" id="band-note"></span>
      </div>
      <div id="round-stats"><p class="state state-loading">加载中…</p></div>
      <div id="podium-body"></div>
    </section>

    <div class="detail-grid">
      <section class="card span-2">
        <header class="card-head">
          <h2 class="card-title">正赛成绩</h2>
          <span class="card-caption" id="result-caption"></span>
        </header>
        <div class="card-body" id="result-body"><p class="state state-loading">加载中…</p></div>
      </section>

      <section class="card">
        <header class="card-head"><h2 class="card-title">排位赛成绩</h2></header>
        <div class="card-body" id="qualifying-body"><p class="state state-loading">加载中…</p></div>
      </section>

      <section class="card">
        <header class="card-head"><h2 class="card-title">进站与轮胎</h2></header>
        <div class="card-body" id="pit-body"><p class="state state-loading">加载中…</p></div>
      </section>

      <section class="card">
        <header class="card-head"><h2 class="card-title">赛道信息</h2></header>
        <div class="card-body" id="circuit-body"><p class="state state-loading">加载中…</p></div>
      </section>

      <section class="card span-2">
        <header class="card-head">
          <h2 class="card-title">本赛季分站冠军</h2>
          <span class="card-caption" id="winners-caption"></span>
        </header>
        <div class="card-body" id="winners-body"><p class="state state-loading">加载中…</p></div>
      </section>
    </div>
  </main>

  <footer class="app-footer"><div class="status-bar" id="status-bar"></div></footer>
  <script type="module" src="../assets/js/pages/results.js"></script>
  <div class="settings-pop" id="settings-pop" hidden></div>
</body>
</html>
